name: Android release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish numbered and rolling releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./publish_release.sh
